<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Back, Shoulders, Biceps – JB23 Fit</title>
<meta name="theme-color" content="#FFC629">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JB23 Fit">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#ECEEF1; --surface:#FFFFFF; --ink:#15171A; --muted:#5A6068; --line:#D3D8DE;
  --gold:#FFC629; --on-gold:#15171A;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme: dark; --bg:#15171A; --surface:#202328; --ink:#F3F4F6; --muted:#A2A8B0; --line:#33373D; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- Overview ---------- */
.home{min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 28px) clamp(20px,5vw,72px) calc(env(safe-area-inset-bottom,0px) + 40px);
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(28px,5vw,80px);max-width:1280px;margin:0 auto;align-items:start}
.brand{font-family:var(--cond);font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:10px;margin-bottom:clamp(24px,6vh,64px)}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--gold);display:inline-block}
.kicker{color:var(--muted);font-weight:600;font-size:1.05rem;margin:0 0 8px}
.home h1{font-family:var(--cond);font-weight:800;font-size:clamp(3rem,8vw,6.5rem);line-height:.9;margin:0 0 20px;letter-spacing:-.01em}
.focus{font-size:1.25rem;font-weight:600;margin:0 0 10px;max-width:34ch}
.intro{color:var(--muted);font-size:1.05rem;line-height:1.55;max-width:52ch;margin:0 0 28px}
.facts{display:flex;gap:28px;margin:0 0 28px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--cond);font-size:2.2rem;font-weight:700;line-height:1}
.facts span{color:var(--muted);font-size:.95rem}
.start{background:var(--gold);color:var(--on-gold);border:0;border-radius:16px;padding:20px 36px;font-family:var(--cond);font-weight:800;font-size:1.7rem;min-width:260px}
.settings{margin-top:32px;border-top:1px solid var(--line);padding-top:20px;display:grid;gap:14px;max-width:460px}
.settings h2{font-size:1rem;font-weight:600;margin:0 0 2px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.row label{font-weight:500}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.switch{appearance:none;width:52px;height:30px;border-radius:30px;background:var(--line);position:relative;margin:0;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch:checked{background:var(--gold)}
.switch:checked::after{transform:translateX(22px)}
.sheet{background:var(--surface);border-radius:22px;padding:clamp(18px,2.5vw,30px);border:1px solid var(--line)}
.sheet h2{font-family:var(--cond);font-weight:700;font-size:1.6rem;margin:0 0 4px}
.sheet .sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.sheet ol{list-style:none;margin:0 0 22px;padding:0;counter-reset:ex}
.sheet li{display:grid;grid-template-columns:2rem 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;counter-increment:ex}
.sheet li::before{content:counter(ex);font-family:var(--cond);font-weight:700;color:var(--muted)}
.sheet li span{color:var(--muted);font-size:.95rem;text-align:right}
.sheet section:last-child ol{margin-bottom:0}

/* ---------- Player (built for a 16:9 TV) ---------- */
.player{position:fixed;inset:0;display:flex;background:#0B0C0E;color:#F3F4F6;
  --pbg:#15171A;--pink:#F3F4F6;--pmuted:#9EA4AC;--pline:#2E3238;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.player.is-rest{--pbg:var(--gold);--pink:#15171A;--pmuted:rgba(21,23,26,.66);--pline:rgba(21,23,26,.22)}
.stage-wrap{height:100%;aspect-ratio:9/16;flex:none;position:relative;background:#000}
.player.zoom .stage-wrap{aspect-ratio:3/4}
.stage{position:absolute;inset:0;overflow:hidden}
.stage-wrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none;transition:opacity .35s}
.player.idle .stage-wrap::after{opacity:0}
.stage iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0;pointer-events:none}
.player.zoom .stage iframe{height:auto;aspect-ratio:9/16;top:50%;transform:translateY(-50%)}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8%;color:#F3F4F6;background:linear-gradient(160deg,#2A2E34,#15171A)}
.placeholder b{font-family:var(--cond);font-weight:700;font-size:4vh;line-height:1}
.placeholder span{color:#A2A8B0;margin-top:1vh;font-size:2vh}
.paused-badge{position:absolute;left:0;right:0;top:0;padding:2vh;text-align:center;font-weight:700;font-size:3vh;background:rgba(0,0,0,.7);color:#fff}

.panel{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;background:var(--pbg);color:var(--pink);
  padding:calc(env(safe-area-inset-top,0px) + 4.5vh) 4vw calc(env(safe-area-inset-bottom,0px) + 4vh) 3.5vw;transition:background .3s}
.topline{display:flex;justify-content:space-between;align-items:baseline;gap:2vw;font-size:2.6vh;font-weight:600;color:var(--pmuted)}
.left-time{font-family:var(--cond);font-weight:700;font-size:3.2vh;font-variant-numeric:tabular-nums}
.name{font-family:var(--cond);font-weight:700;font-size:clamp(2rem,9.5vh,7rem);line-height:.95;margin:2.5vh 0 0;letter-spacing:-.005em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:1.2vh;margin-top:2.4vh}
.chip{font-weight:700;font-size:3.4vh;padding:.25em .75em;border-radius:999px;border:.35vh solid var(--pline)}
.chip.solid{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.is-rest .chip.solid{background:#15171A;color:var(--gold);border-color:#15171A}
.count{display:flex;align-items:flex-end;gap:2vw;margin-top:auto}
.big{font-family:var(--cond);font-weight:800;font-size:28vh;line-height:.78;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big.in-range{color:var(--gold)}
.is-rest .big{font-size:38vh}
.count-side{display:flex;flex-direction:column;padding-bottom:1vh;font-size:3.4vh}
.count-side b{font-family:var(--cond);font-weight:700;font-size:1.35em}
.count-side span{color:var(--pmuted);font-weight:600}
.bar{height:1.3vh;border-radius:99px;background:var(--pline);overflow:hidden;margin-top:3vh}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px}
.is-rest .bar i{background:#15171A}
.cue{font-size:3.2vh;line-height:1.35;margin:3vh 0 0;max-width:44ch}
.cue:empty{display:none}
.cue small{display:block;color:var(--pmuted);font-size:.72em;font-weight:700;margin-bottom:.6vh}
.segs{display:flex;gap:.25vw;margin-top:3.5vh}
.segs i{flex:1;min-width:0;height:.7vh;border-radius:1vh;background:var(--pline)}
.segs i.past{background:var(--pmuted)}
.segs i.now{background:var(--pink)}
.controls{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4%);transform:translateX(-50%);display:flex;align-items:center;gap:max(10px,1.6vh);z-index:2;white-space:nowrap;transition:opacity .35s}
.player.idle .controls{opacity:0;pointer-events:none}
.ctl{width:max(48px,8.5vh);height:max(48px,8.5vh);border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);touch-action:manipulation}
.ctl svg{width:44%;height:44%;fill:currentColor}
.ctl.primary{width:auto;border-radius:999px;padding:0 max(20px,3vh);background:var(--gold);color:var(--on-gold);font-weight:800;font-size:max(16px,2.8vh)}
.is-rest .ctl.primary{background:#fff;color:#15171A}
.end-btn{background:none;border:.25vh solid var(--pline);color:var(--pink);border-radius:1.2vh;padding:.3em .9em;font-weight:700;font-size:max(13px,2.2vh);margin-left:1.5vw;transition:opacity .35s;touch-action:manipulation}
.player.idle .end-btn{opacity:0;pointer-events:none}

/* Phone held upright (not casting) */
@media (max-aspect-ratio: 4/5){
  .player{flex-direction:column}
  .stage-wrap,.player.zoom .stage-wrap{height:46%;aspect-ratio:auto;width:100%}
  .stage iframe,.player.zoom .stage iframe{height:100%;width:auto;aspect-ratio:9/16;left:50%;top:0;transform:translateX(-50%)}
  .panel{padding:2.5vh 5vw}
  .name{font-size:5vh}.big{font-size:14vh}.is-rest .big{font-size:18vh}.chip{font-size:2.2vh}.count-side{font-size:2.2vh}
}
@media (max-width: 820px){
  .home{grid-template-columns:1fr}
}

/* ---------- Finished ---------- */
.done{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:40px clamp(20px,6vw,80px);max-width:900px;margin:0 auto}
.done h1{font-family:var(--cond);font-weight:800;font-size:clamp(3rem,10vw,7rem);line-height:.9;margin:0 0 18px}
.done p{font-size:1.3rem;color:var(--muted);margin:0 0 28px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<main class="home" id="home">
  <div>
    <div class="brand"><i aria-hidden="true"></i>JB23 Fit</div>
    <p class="kicker" id="h-kicker"></p>
    <h1 id="h-title"></h1>
    <p class="focus" id="h-focus"></p>
    <p class="intro" id="h-intro"></p>
    <div class="facts">
      <div><b id="h-time"></b><span>minutes, about</span></div>
      <div><b id="h-ex"></b><span>exercises</span></div>
      <div><b id="h-sets"></b><span>sets</span></div>
    </div>
    <button class="start" id="startBtn">Start workout</button>

    <div class="settings">
      <h2>Settings</h2>
      <div class="row"><label for="autoCount">Count reps for me</label><input type="checkbox" class="switch" id="autoCount"></div>
      <div class="row"><span id="tempoLabel">Rep pace</span>
        <div class="seg" role="group" aria-labelledby="tempoLabel" id="tempo">
          <button data-v="2">Fast</button><button data-v="3">Mid</button><button data-v="4">Slow</button>
        </div>
      </div>
      <div class="row"><label for="zoom">Zoom video to fill more of the TV</label><input type="checkbox" class="switch" id="zoom"></div>
      <div class="row"><label for="voice">Voice cues</label><input type="checkbox" class="switch" id="voice"></div>
      <div class="row"><label for="beeps">Beeps</label><input type="checkbox" class="switch" id="beeps"></div>
    </div>
  </div>
  <div class="sheet" id="sheet"></div>
</main>

<div class="player" id="player" hidden>
  <div class="stage-wrap">
    <div class="stage" id="stage"></div>
    <div class="controls" id="controls">
      <button class="ctl" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.5v14H6zM10 12l9-7v14z"/></svg></button>
      <button class="ctl" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg></button>
      <button class="ctl primary" id="nextBtn">Done</button>
    </div>
  </div>
  <div class="panel">
    <div class="topline"><span id="p-pos"></span><span><span class="left-time" id="p-left"></span><button class="end-btn" id="endBtn">End</button></span></div>
    <h2 class="name" id="p-name"></h2>
    <div class="chips" id="p-chips"></div>
    <div class="count"><div class="big" id="p-big"></div><div class="count-side" id="p-side"></div></div>
    <div class="bar"><i id="p-bar"></i></div>
    <p class="cue" id="p-cue"></p>
    <div class="segs" id="segs" aria-hidden="true"></div>
  </div>
</div>

<main class="done" id="done" hidden>
  <div class="brand"><i aria-hidden="true"></i>JB23 Fit</div>
  <h1>Workout complete</h1>
  <p id="d-text"></p>
  <div><button class="start" id="againBtn">Back to overview</button></div>
</main>

<script>
/* ============================================================
   WORKOUT DATA — pulled from Trainerize ("Dumbbell Shred").
   To add a demo video, paste the YouTube video ID into `video`
   (the part after "v=" in the YouTube link).
   ============================================================ */
const WORKOUT = {
  program: "Dumbbell Shred",
  day: "Week 1, Day 1",
  title: "Back, Shoulders, Biceps",
  focus: "Posture, pulling strength, and upper-body control",
  intro: "Build strong, stable pulling patterns and clean arm strength while keeping your posture locked in. Drive the elbows with intent, control the negative on every rep, and stay tall through your core.",
  blocks: [
    { name: "Warm-up", type: "circuit", rounds: 1, restAfter: 15, items: [
      { name: "Bodyweight Squat", reps: 10, cue: "Weight in heels, drive knees out over ankles", video: "c685FvzmlA8" },
      { name: "Reverse Lunge + Twist", reps: 5, perSide: true, cue: "Staple lead heel down, step back, brace and rotate", video: "sUaO0tWZF7I" },
      { name: "Bushwackers", reps: 10, cue: "Stretch hands as high/low as possible, swing arms, loose shoulders", video: "2VoIdjS-BwI" },
      { name: "Backslaps", reps: 10, cue: "Alternate hand on top, squeeze shoulder blades on stretch back, roll shoulder blades on stretch forward", video: "Eqll-LkFlgQ" },
      { name: "Forearm Stretch", time: 30, note: "15 sec / arm", cue: "Extend arm, point hand up and pull fingers back, point hand down and pull fingers back, flip hand over and pull fingers back", video: "Xf7ZNZJLtWE" }
    ]},
    { name: "Main work", type: "sets", rest: 45, items: [
      { name: "Back Squeeze", sets: 2, reps: [12,15], cue: "Shoulders away from ears, drive shoulder blades together and squeeze back", video: "4EDw-JaLds8" },
      { name: "Supinated Row", sets: 3, reps: [12,15], cue: "Push dumbbells away and counterbalance hips, drive elbows behind spine and squeeze back", video: "bKLftkWptjE" },
      { name: "Gorilla Row", sets: 3, reps: [12,15], cue: "Brace and hold spine angle, create as much space between dumbbells on each row, stay smooth and rotate mid spine", video: "pTCEWUAqRrw" },
      { name: "Bent Over Row", sets: 3, reps: [12,15], cue: "Brace core and hold spine angle, exhale and drive dumbbells straight up, inhale and resist to bottom", video: "aT4-gV77EQQ" },
      { name: "Side Kneeling Back Extension", sets: 2, reps: [10,12], perSide: true, cue: "Keep shoulders away from ears and shoulder blades tight, drive knee/foot down through floor on raise", video: "OFHOP_uPE7Y" },
      { name: "Shrug 2x", sets: 2, reps: [12,15], cue: "Let dumbbells pull traps down, exhale and full squeezes at top", video: "Si7NKkqUZCo" },
      { name: "Upright Row + Front Raise", sets: 2, reps: [10,12], cue: "Drive elbows outside shoulders in row, shoulders away from ears in front raise", video: "p5JYSFYcepM" },
      { name: "Rear Delt Fly + Skier Row", sets: 2, reps: [10,12], cue: "Push dumbbells out and away, pause then straight line push back in row", video: "8YkLXFppj8I" },
      { name: "Curl", sets: 3, reps: [12,15], cue: "Shoulders away from ears, drive dumbbells to shoulder and squeeze, return arms to full length", video: "BCnFnzyW3wM" },
      { name: "Hammer Curl + Shoulder 90", sets: 2, reps: [10,12], cue: "Big squeeze in curl contraction, keep biceps tight in transition, shoulders away from ears in shoulder 90", video: "laQ3WCNzb1o" }
    ]},
    { name: "Cool-down", type: "circuit", rounds: 1, items: [
      { name: "Thoracic Turns", reps: 5, perSide: true, cue: "Inhale and tuck elbow, exhale and extend elbow to sky, eyes follow elbow", video: "HrumFTqqAE0" },
      { name: "Cat Cow", reps: 10, cue: "Inhale and push belly button to ground and crown to sky, exhale and press ground away, extend mid spine to sky", video: "ugY4PMqKOvY" },
      { name: "Forward Stretch", time: 15, cue: "Big inhale and exhale, extend forward, hold ankles/leg, keep face relaxed, slowly articulate back up", video: "ilaJMLx4SQs" },
      { name: "Triple Push Out", manual: true, label: "1 rep, 3 pushes", cue: "Interlock fingers, inhale/exhale into push, hold position, inhale/exhale into second push, hold position, inhale/exhale into third and final push", video: "v9UtneQo5Nw" }
    ]}
  ]
};
const READY_SECONDS = 6;      // short "get ready" gap between moves in a circuit
const START_SECONDS = 10;     // countdown after tapping Start workout
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>';
//      // short "get ready" gap between moves in a circuit
const MANUAL_ESTIMATE = 40;   // seconds assumed for tap-to-finish moves when estimating time

/* ---------------- Settings ---------------- */
const settings = { autoCount: true, tempo: 3, voice: true, beeps: true, zoom: true };
try { Object.assign(settings, JSON.parse(localStorage.getItem("jb23-settings") || "{}")); } catch (e) {}
function saveSettings(){ try { localStorage.setItem("jb23-settings", JSON.stringify(settings)); } catch (e) {} }

/* ---------------- Build the step list ---------------- */
const $ = id => document.getElementById(id);
const fmtRange = r => Array.isArray(r) ? `${r[0]}–${r[1]}` : `${r}`;
function mkWork(it, meta){
  const repMin = Array.isArray(it.reps) ? it.reps[0] : it.reps;
  const repMax = Array.isArray(it.reps) ? it.reps[1] : it.reps;
  let mode = it.time ? "time" : it.manual ? "manual" : "reps";
  let target = mode === "time" ? `${it.time} sec${it.note ? ", " + it.note : ""}`
             : mode === "manual" ? it.label
             : `${fmtRange(it.reps)} reps${it.perSide ? " / side" : ""}`;
  return { kind: "work", ...it, mode, repMin, repMax, target, ...meta };
}
function buildSteps(){
  const work = [];
  WORKOUT.blocks.forEach(b => {
    if (b.type === "circuit"){
      for (let r = 1; r <= b.rounds; r++) b.items.forEach((it, i) => {
        const last = r === b.rounds && i === b.items.length - 1;
        work.push(mkWork(it, { section: b.name,
          position: `${b.name}, move ${i+1} of ${b.items.length}${b.rounds > 1 ? `, round ${r} of ${b.rounds}` : ""}`,
          setLabel: null, after: last ? (b.restAfter || 0) : "ready" }));
      });
    } else {
      b.items.forEach((it, i) => {
        for (let s = 1; s <= it.sets; s++){
          work.push(mkWork(it, { section: b.name,
            position: `${b.name}, exercise ${i+1} of ${b.items.length}`,
            setLabel: `Set ${s} of ${it.sets}`, after: b.rest }));
        }
      });
    }
  });
  const steps = [];
  work.forEach((w, i) => {
    steps.push(w);
    const next = work[i+1];
    if (!next) return;
    if (typeof w.after === "number" && w.after > 0) steps.push({ kind: "rest", dur: w.after, next });
    else steps.push({ kind: "ready", dur: READY_SECONDS, next });
  });
  if (work.length) steps.unshift({ kind: "ready", dur: START_SECONDS, next: work[0], start: true });
  return steps;
}
let steps = buildSteps();

// Seconds per rep. Set `repSec` on an exercise to match its video exactly.
function repSec(s){ return s.repSec || settings.tempo; }
function stepDur(s){
  if (s.kind !== "work") return s.dur;
  if (s.mode === "time") return s.time;
  if (s.mode === "reps" && settings.autoCount) return s.repMax * (s.perSide ? 2 : 1) * repSec(s);
  return Infinity;
}
const estDur = s => { const d = stepDur(s); return isFinite(d) ? d : MANUAL_ESTIMATE; };
const fmtClock = sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`; };

/* ---------------- Overview ---------------- */
function renderHome(){
  $("h-kicker").textContent = `${WORKOUT.program}, ${WORKOUT.day}`;
  $("h-title").textContent = WORKOUT.title;
  $("h-focus").textContent = WORKOUT.focus;
  $("h-intro").textContent = WORKOUT.intro;
  const works = steps.filter(s => s.kind === "work");
  $("h-time").textContent = Math.round(steps.reduce((a, s) => a + estDur(s), 0) / 60);
  $("h-ex").textContent = WORKOUT.blocks.reduce((a, b) => a + b.items.length, 0);
  $("h-sets").textContent = works.length;
  $("sheet").innerHTML = WORKOUT.blocks.map(b => {
    const sub = b.type === "sets" ? `Rest ${b.rest} sec between sets` : `${b.rounds} round${b.rounds > 1 ? "s" : ""}, straight through${b.restAfter ? `, then rest ${b.restAfter} sec` : ""}`;
    const rows = b.items.map(it => {
      const w = mkWork(it, {});
      return `<li><strong>${it.name}</strong><span>${it.sets ? it.sets + " × " : ""}${w.target}</span></li>`;
    }).join("");
    return `<section><h2>${b.name}</h2><p class="sub">${sub}</p><ol>${rows}</ol></section>`;
  }).join("");
  $("autoCount").checked = settings.autoCount;
  $("voice").checked = settings.voice;
  $("beeps").checked = settings.beeps;
  $("zoom").checked = settings.zoom;
  document.querySelectorAll("#tempo button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === settings.tempo)));
}
["autoCount","voice","beeps","zoom"].forEach(k => $(k).addEventListener("change", e => { settings[k] = e.target.checked; saveSettings(); renderHome(); }));
document.querySelectorAll("#tempo button").forEach(b => b.addEventListener("click", () => { settings.tempo = +b.dataset.v; saveSettings(); renderHome(); }));

/* ---------------- Sound & voice ---------------- */
let ac;
function beep(freq = 880, dur = .15, vol = .25){
  if (!settings.beeps) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
function say(text){
  if (!settings.voice || !("speechSynthesis" in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.02; speechSynthesis.speak(u); } catch (e) {}
}

/* ---------------- Keep the screen awake ---------------- */
let wakeLock = null;
async function lockScreen(){ try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("player").hidden) lockScreen(); });

/* ---------------- Video ---------------- */
let currentVideoKey = null;
let ytReady = false, ytPlayer = null, ytPlayerReady = false, ytFailed = false;
window.onYouTubeIframeAPIReady = () => { ytReady = true; };
(function loadYT(){
  const sc = document.createElement("script");
  sc.src = "https://www.youtube.com/iframe_api";
  document.head.append(sc);
})();
function setVideo(ex){
  const key = ex.video ? "yt:" + ex.video : "ph:" + ex.name;
  if (key === currentVideoKey) return;
  currentVideoKey = key;
  try { ytPlayer && ytPlayer.destroy && ytPlayer.destroy(); } catch (e) {}
  ytPlayer = null; ytPlayerReady = false; ytFailed = false;
  const stage = $("stage");
  stage.innerHTML = "";
  if (ex.video && ytReady){
    const host = document.createElement("div");
    stage.append(host);
    const id = ex.video;
    const player = new YT.Player(host, {
      host: "https://www.youtube-nocookie.com",
      videoId: id,
      playerVars: { autoplay: 1, mute: 1, loop: 1, playlist: id, controls: 0, playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, disablekb: 1, fs: 0 },
      events: {
        onReady: e => {
          if (player !== ytPlayer) return;
          ytPlayerReady = true;
          try {
            e.target.mute();
            const f = e.target.getIframe(); f.title = `${ex.name} demo video`; f.tabIndex = -1;
            if (paused) e.target.pauseVideo(); else e.target.playVideo();
          } catch (err) {}
        },
        onError: () => { if (player === ytPlayer) ytFailed = true; }
      }
    });
    ytPlayer = player;
  } else if (ex.video){
    const f = document.createElement("iframe");
    const id = encodeURIComponent(ex.video);
    f.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3`;
    f.allow = "autoplay; encrypted-media; picture-in-picture";
    f.title = `${ex.name} demo video`;
    f.tabIndex = -1;
    stage.append(f);
  } else {
    const p = document.createElement("div");
    p.className = "placeholder";
    p.innerHTML = `<b></b><span>Demo video not added yet</span>`;
    p.querySelector("b").textContent = ex.name;
    stage.append(p);
  }
  if (paused) showPausedBadge(true);
}
// True when the demo video is actually playing (or there's no controllable video).
function videoPlaying(){
  if (!ytPlayer || ytFailed) return true;
  if (!ytPlayerReady) return false;
  try { const st = ytPlayer.getPlayerState(); return st === 1 || st === 0; } catch (e) { return true; }
}
function restartVideo(){
  if (!ytPlayer || !ytPlayerReady || ytFailed) return;
  try { ytPlayer.seekTo(0, true); ytPlayer.playVideo(); } catch (e) {}
}
function pauseVideo(on){
  if (!ytPlayer || !ytPlayerReady) return;
  try { on ? ytPlayer.pauseVideo() : ytPlayer.playVideo(); } catch (e) {}
}
function showPausedBadge(on){
  let b = $("stage").querySelector(".paused-badge");
  if (on && !b){ b = document.createElement("div"); b.className = "paused-badge"; b.textContent = "Paused"; $("stage").append(b); }
  if (!on && b) b.remove();
}

/* ---------------- Player engine ---------------- */
let stall = 0, idx = 0, t = 0, paused = false, lastTick = 0, timer = null, lastBeep = null, lastRep = 0, startTime = 0, sideAnnounced = false;

function startWorkout(){
  steps = buildSteps();
  idx = 0; t = 0; paused = false; startTime = Date.now();
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  $("home").hidden = true; $("done").hidden = true; $("player").hidden = false;
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  lockScreen();
  $("player").classList.toggle("zoom", !!settings.zoom);
  wake();
  $("segs").innerHTML = steps.filter(s => s.kind === "work").map(() => "<i></i>").join("");
  currentVideoKey = null;
  enterStep();
  lastTick = performance.now();
  clearInterval(timer);
  timer = setInterval(tick, 100);
}

function enterStep(){
  const s = steps[idx];
  t = 0; stall = 0; lastBeep = null; lastRep = 0; sideAnnounced = false;
  $("player").classList.toggle("is-rest", s.kind !== "work");
  setVideo(s.kind === "work" ? s : s.next);
  if (s.kind === "work") restartVideo();   // video and rep count start together
  if (s.kind === "work"){
    beep(988, .28, .3);
    if (s.mode === "manual" || (s.mode === "reps" && !settings.autoCount)) say(`${s.name}. ${s.target}. Tap done when finished.`);
    else if (s.mode === "time") say(`${s.name}. ${s.time} seconds. Go.`);
    else say(`Go. ${s.target}${s.perSide ? ". Left side first" : ""}.`);
  } else {
    const n = s.next;
    const what = `${n.name}${n.setLabel ? ", " + n.setLabel.toLowerCase() : ""}`;
    say(s.start ? `Get ready. First up, ${what}.` : s.kind === "rest" ? `Rest ${s.dur} seconds. Next up, ${what}.` : `Next, ${what}.`);
  }
  render();
}

function advance(){
  idx++;
  if (idx >= steps.length){ finish(); return; }
  enterStep();
}

function goBack(){
  const s = steps[idx];
  if (s.kind === "work" && t > 3){ enterStep(); return; }
  let j = idx - 1;
  while (j >= 0 && steps[j].kind !== "work") j--;
  if (j < 0) j = 0;
  idx = j; enterStep();
}

let idleTimer;
function wake(){
  const p = $("player");
  p.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!paused) p.classList.add("idle"); }, 4000);
}
$("player").addEventListener("pointerdown", wake, true);

function togglePause(){
  paused = !paused;
  wake();
  pauseVideo(paused);
  $("pauseBtn").innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
  $("pauseBtn").setAttribute("aria-label", paused ? "Resume" : "Pause");
  showPausedBadge(paused);
  if (paused && "speechSynthesis" in window) speechSynthesis.cancel();
  render();
}

function tick(){
  const now = performance.now(), dt = (now - lastTick) / 1000;
  lastTick = now;
  if (paused) return;
  const s = steps[idx];
  // Rep counting follows the video: hold the count while the clip loads or buffers.
  const synced = s.kind === "work" && s.mode === "reps" && settings.autoCount;
  if (synced && !videoPlaying() && stall < 5){ stall += dt; render(); return; }
  t += dt;
  const d = stepDur(s);
  if (isFinite(d)){
    const remain = Math.ceil(d - t);
    if ((s.kind !== "work" || s.mode === "time") && remain <= 3 && remain >= 1 && remain !== lastBeep){ beep(660, .12); lastBeep = remain; }
    if (t >= d){ advance(); return; }
  }
  if (s.kind === "work" && s.mode === "reps" && settings.autoCount){
    const rep = Math.min(Math.floor(t / repSec(s)) + 1, s.repMax * (s.perSide ? 2 : 1));
    if (rep !== lastRep){
      if (lastRep) beep(520, .06, .15);
      lastRep = rep;
      if (s.perSide && rep === s.repMax + 1 && !sideAnnounced){ sideAnnounced = true; say("Switch sides"); }
    }
  }
  render();
}

function render(){
  const s = steps[idx];
  const d = stepDur(s);
  const big = $("p-big"), side = $("p-side"), chips = $("p-chips");
  big.classList.remove("in-range");
  side.innerHTML = "";
  if (s.kind === "work"){
    $("p-pos").textContent = s.position;
    $("p-name").textContent = s.name;
    chips.innerHTML = (s.setLabel ? `<span class="chip solid">${s.setLabel}</span>` : `<span class="chip solid">${s.section}</span>`) + `<span class="chip">${s.target}</span>`;
    if (s.mode === "time"){
      big.textContent = Math.ceil(Math.max(0, d - t));
      side.innerHTML = `<b>sec</b><span>${s.note || "hold and breathe"}</span>`;
    } else if (s.mode === "reps" && settings.autoCount){
      const total = s.repMax * (s.perSide ? 2 : 1);
      const rep = Math.min(Math.floor(t / repSec(s)) + 1, total);
      const shown = s.perSide ? ((rep - 1) % s.repMax) + 1 : rep;
      big.textContent = shown;
      if (shown >= s.repMin) big.classList.add("in-range");
      const sideTxt = s.perSide ? (rep <= s.repMax ? "Left side" : "Right side") : (s.repMin !== s.repMax ? (shown >= s.repMin ? "Keep going or tap done" : `Aim for ${s.repMin}–${s.repMax}`) : "reps");
      side.innerHTML = `<b>of ${s.repMax}</b><span>${sideTxt}</span>`;
    } else {
      big.textContent = s.mode === "manual" ? "Go" : fmtRange(s.reps);
      side.innerHTML = `<b>${s.mode === "manual" ? "" : "reps"}</b><span>Tap done when finished</span>`;
    }
    $("p-cue").innerHTML = "";
    $("p-bar").style.width = isFinite(d) ? `${Math.min(100, t / d * 100)}%` : "0%";
    $("nextBtn").textContent = "Done";
  } else {
    const n = s.next;
    $("p-pos").textContent = s.start ? "Starting in" : s.kind === "rest" ? "Rest" : "Get ready";
    $("p-name").textContent = `${s.start ? "First up" : "Next"}: ${n.name}`;
    chips.innerHTML = (n.setLabel ? `<span class="chip solid">${n.setLabel}</span>` : "") + `<span class="chip">${n.target}</span>`;
    big.textContent = Math.ceil(Math.max(0, d - t));
    side.innerHTML = `<b>sec</b><span>${s.kind === "rest" ? "Breathe, reset" : "Get in position"}</span>`;
    $("p-cue").innerHTML = "<small>Coach’s cue</small>";
    $("p-cue").append(document.createTextNode(n.cue));
    $("p-bar").style.width = `${Math.min(100, t / d * 100)}%`;
    $("nextBtn").textContent = s.kind === "rest" ? "Skip rest" : "Start now";
  }
  // Time left and overall progress
  let left = Math.max(0, (isFinite(d) ? d : MANUAL_ESTIMATE) - t);
  for (let j = idx + 1; j < steps.length; j++) left += estDur(steps[j]);
  $("p-left").textContent = `${fmtClock(left)} left`;
  const workIdx = steps.slice(0, idx + 1).filter(x => x.kind === "work").length - (s.kind === "work" ? 1 : 0);
  document.querySelectorAll("#segs i").forEach((seg, i) => {
    seg.className = i < workIdx ? "past" : (i === workIdx && s.kind === "work") ? "now" : "";
  });
}

function finish(){
  clearInterval(timer);
  try { wakeLock && wakeLock.release(); } catch (e) {}
  try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {}
  $("player").hidden = true; $("done").hidden = false;
  const mins = Math.round((Date.now() - startTime) / 60000);
  $("d-text").textContent = `You finished ${WORKOUT.title} in ${mins} minute${mins === 1 ? "" : "s"}. Nice work.`;
  beep(988, .2); setTimeout(() => beep(1318, .35), 220);
  say("Workout complete. Nice work.");
}

function endWorkout(){
  if (!confirm("End this workout?")) return;
  clearInterval(timer);
  try { speechSynthesis.cancel(); } catch (e) {}
  try { wakeLock && wakeLock.release(); } catch (e) {}
  try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {}
  paused = false; $("pauseBtn").innerHTML = ICON_PAUSE; $("pauseBtn").setAttribute("aria-label", "Pause");
  $("player").hidden = true; $("home").hidden = false;
  renderHome();
}

$("startBtn").addEventListener("click", startWorkout);
$("againBtn").addEventListener("click", () => { $("done").hidden = true; $("home").hidden = false; renderHome(); });
$("nextBtn").addEventListener("click", advance);
$("backBtn").addEventListener("click", goBack);
$("pauseBtn").addEventListener("click", togglePause);
$("endBtn").addEventListener("click", endWorkout);
document.addEventListener("keydown", e => {
  if ($("player").hidden) return;
  wake();
  if (e.key === " "){ e.preventDefault(); togglePause(); }
  else if (e.key === "ArrowRight" || e.key === "Enter"){ e.preventDefault(); advance(); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); goBack(); }
});

renderHome();
</script>
</body>
</html>
